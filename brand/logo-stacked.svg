<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 116" role="img" aria-label="Land a Job">
  <title>Land a Job — stacked</title>
  <!-- 竖排组合：方形头像位、README 头部、贴纸等横向不够的地方用它。
       方块 y 6–70，文字基线 110（"Land a Job" 无下伸部，字形底就是基线）：
       上下各留 6，内容包围盒居中，不靠肉眼调。 -->
  <rect x="68" y="6" width="64" height="64" rx="15" fill="#1c1917"/>
  <path
    d="M87.8 24v28h17"
    fill="none"
    stroke="#ffffff"
    stroke-width="6.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="109.8" cy="33" r="6.2" fill="#34d399"/>
  <text
    x="100"
    y="110"
    text-anchor="middle"
    fill="#1c1917"
    font-family="ui-sans-serif, -apple-system, 'SF Pro Text', 'PingFang SC', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-size="26"
    font-weight="600"
    letter-spacing="-0.5"
  >Land a Job</text>
</svg>
