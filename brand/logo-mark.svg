<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Land a Job">
  <title>Land a Job</title>
  <!-- 主标。64 网格；L 逐点对齐到 2 的倍数，缩放时不出现半像素。
       L 的臂弯里那颗绿点是「落点」：投递最终要落到一个 offer 上。
       几何已居中——组合外框 x 16.6–48、y 14.8–49.2，中心 (32.3, 32)。 -->
  <rect width="64" height="64" rx="15" fill="#1c1917"/>
  <path
    d="M19.8 18v28h17"
    fill="none"
    stroke="#ffffff"
    stroke-width="6.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="41.8" cy="27" r="6.2" fill="#34d399"/>
</svg>
