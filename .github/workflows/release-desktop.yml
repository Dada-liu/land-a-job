name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            artifact: dmg
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            artifact: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 sidecar 一致用 v24：v22 在 macOS 26 上加载 N-API 原生模块会 segfault
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps (all workspaces)
        run: npm ci

      - name: Build server / mcp / web / core
        run: npm run build

      - name: Fetch Node sidecar (${{ matrix.triple }})
        shell: bash
        run: bash apps/desktop/scripts/fetch-sidecar.sh ${{ matrix.triple }}

      - name: Stage desktop resources
        run: npm run desktop:stage

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        shell: bash
        run: npm run build -w @land/desktop

      - name: Collect artifact
        shell: bash
        run: |
          # GitHub 会剥离 asset 文件名中的非 ASCII 字符，统一改成 ASCII 文件名
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p release-artifact
          if [ "${{ matrix.artifact }}" = "dmg" ]; then
            cp apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg "release-artifact/land-a-job_${VERSION}_aarch64.dmg"
          else
            cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe "release-artifact/land-a-job_${VERSION}_x64-setup.exe"
          fi

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
            echo "tag=desktop-v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Land a Job ${{ steps.tag.outputs.tag }}
          body: |
            ## 安装提示

            **macOS**：应用未做 Apple 公证，下载的 dmg 安装后首次打开若提示
            「"Land a Job"已损坏，无法打开」，在终端执行一次：

            ```bash
            xattr -cr /Applications/Land\ a\ Job.app
            ```

            **Windows**：SmartScreen 提示时选「仍要运行」。

            首次使用需输入授权码激活（一机一码）；设置页「数据和 Agent 连接」
            有通过 WorkBuddy / Kimi 等 Agent 连接的步骤说明。
          generate_release_notes: true
          files: release-artifact/*
